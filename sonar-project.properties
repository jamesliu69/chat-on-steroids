sonar.projectKey=chat-on-steroids
sonar.projectName=Chat On Steroids
sonar.sourceEncoding=UTF-8

# Production code
sonar.sources=src,extension,scripts
sonar.tests=test

# Build outputs, vendored and non-code trees
sonar.exclusions=**/node_modules/**,**/out/**,**/dist/**,**/release/**,**/build/**,**/resources/**,**/native/**,**/artwork/**,**/pets/**,**/docs/**,**/.tmp/**,**/outputs/**,**/.codegraph/**,**/.githooks/**

# No coverage report is generated today; keep coverage noise out of the UI
sonar.coverage.exclusions=**/*
